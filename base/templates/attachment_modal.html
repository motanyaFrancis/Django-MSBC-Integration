<!-- ============================================================
   GLOBAL ATTACHMENT UPLOAD MODAL
   attachment_modal.html  — include once in base.html or
   at the bottom of any detail page template.

   How to open from ANY button / link on the page:
   ─────────────────────────────────────────────────────────
   <button
       data-bs-toggle="modal"
       data-bs-target="#attachmentModal"
       data-upload-url=""
       data-doc-no="{{ res.Application_No }}"
       data-table-name="Leave">
       Upload Attachment
   </button>

   Swap data-upload-url / data-doc-no / data-table-name per page.

   After a successful upload the JS dispatches:
       document.addEventListener('dz:uploaded', function(e){
           // e.detail.docNo   — document number
           // e.detail.count   — files uploaded
           // refresh your attachment table here
       });
   ============================================================ -->

<div class="modal fade" id="attachmentModal" tabindex="-1"
     aria-labelledby="attachmentModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width:520px;">
        <div class="modal-content border-0 rounded-4 overflow-hidden shadow">

            <!-- ── Header ─────────────────────────────────────── -->
            <div class="modal-header dz-modal-header border-0">
                <div>
                    <h5 class="modal-title mb-0" id="attachmentModalLabel">
                        <i class="mdi mdi-paperclip me-1"></i> Upload Attachments
                    </h5>
                    <small class="text-white opacity-75" id="dzDocTitle"></small>
                </div>
                <button type="button" class="btn-close btn-close-white"
                        data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <!-- ── Body ───────────────────────────────────────── -->
            <div class="modal-body p-4">

                <!-- Drop zone -->
                <div class="dz-zone" id="dzZone" role="button"
                     aria-label="Drop files here or click to browse">

                    <div class="dz-zone-icon">
                        <i class="mdi mdi-cloud-upload-outline"></i>
                    </div>

                    <p class="dz-zone-title mb-1">Drop files here</p>
                    <p class="dz-zone-sub">or</p>
                    <span class="dz-browse-btn">Browse Files</span>

                    <!-- Accepted types chips -->
                    <div class="dz-type-chips mt-3">
                        <span class="dz-type-chip">PDF</span>
                        <span class="dz-type-chip">DOC</span>
                        <span class="dz-type-chip">DOCX</span>
                        <span class="dz-type-chip">XLS</span>
                        <span class="dz-type-chip">XLSX</span>
                        <span class="dz-type-chip">JPG</span>
                        <span class="dz-type-chip">PNG</span>
                        <span class="dz-type-chip">PPT</span>
                        <span class="dz-type-chip">TXT</span>
                    </div>

                    <p class="dz-zone-sub mt-2 mb-0" style="font-size:.72rem;">
                        Max 10 MB per file
                    </p>

                    <!-- Hidden file input (multiple) -->
                    <input type="file" id="dzFileInput"
                           accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,.txt,.ppt,.pptx"
                           multiple hidden>
                </div>

                <!-- Queued files list -->
                <p class="dz-empty-hint" id="dzEmptyHint">No files selected yet.</p>
                <ul class="dz-file-list" id="dzFileList"></ul>

                <!-- Upload progress -->
                <div id="dzProgress" class="dz-progress-wrap" style="display:none;">
                    <div class="progress">
                        <div class="progress-bar" id="dzProgressBar"
                             role="progressbar" style="width:0%"
                             aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                        </div>
                    </div>
                    <div class="dz-progress-label">
                        <span id="dzProgressLabel">Uploading…</span>
                        <span id="dzProgressPct">0%</span>
                    </div>
                </div>

                <!-- Inline result message -->
                <div id="dzResult" class="dz-result"></div>

            </div>

            <!-- ── Footer ─────────────────────────────────────── -->
            <div class="modal-footer border-0 pt-0 pb-4 px-4 gap-2">
                <button type="button" class="btn btn-outline-danger"
                        data-bs-dismiss="modal">
                    <i class="mdi mdi-close-circle-outline me-2"></i>Cancel
                </button>
                <button type="button" class="btn btn-primary px-4"
                        id="dzUploadBtn" disabled>
                    <i class="mdi mdi-upload me-1"></i> Upload Files
                </button>
            </div>

        </div>
    </div>
</div>
