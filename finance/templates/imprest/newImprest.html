<!-- NEW LEAVE REQUEST MODAL -->

<div class="modal fade" id="addNewImprest" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="modal-header bg-primary text-white border-0 px-4 py-3">
                <div>
                    <h4 class="modal-title fw-bold mb-1"><i class="las la-calendar-plus me-2"></i>New Leave Request</h4>
                    <small class="opacity-75">Complete the steps below to submit your leave request</small>
                </div>
                <button type="button" class="btn-close btn-close-white" id="leave_close-modal" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <!-- BODY -->
            <div class="modal-body bg-light p-4">
                <form class="myForm" id="ImprestForm" method="post" novalidate>
                    {% csrf_token %}
                    <input type="hidden" name="imprestNo" id="imprestNo" value="">
                    <input type="hidden" name="myAction" id="myAction" value="insert">
                    <div class="row my-3">
                        <div class="col-md-4">
                            <label class="form-label">Apply on Behalf<span class="text-danger">*</span></label>
                            <select class="form-select" name="isOnBehalf" id="isOnBehalf" required>
                                <option value="True">Yes</option>
                                <option value="False" selected>No</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Use Budget Memo<span class="text-danger">*</span></label>
                            <select class="form-select" name="use_memo" id="use_memo" required>
                                <option value="True">Yes</option>
                                <option value="False" selected>No</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Department <span class="text-danger">*</span></label>
                            <select class="form-select" name="divisionCode" id="divisionCode">
                                <option disabled value="0">--Select--</option>
                            </select>
                        </div>
                    </div>
                    <div class="row" id="budget_memo_row" style="display: none;">
                        <div class="col-md-12">
                            <label class="form-label">Budget Memo <span class="text-danger">*</span></label>
                            <select class="form-select" name="budget_memo" id="budget_memo" disabled>
                                <option selected disabled value="0">--Select Option--</option>
                                {% for memo in memos %}
                                <option value="{{memo.No}}">{{memo.SubJect}} ({{memo.No}})</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="row my-3">
                        <div class="col-md-12">
                            <label for="purpose" class="form-label">Purpose <span
                                    class="text-danger">*</span></label>
                            <textarea class="form-control" name="purpose" id="purpose" rows="3" required></textarea>
                        </div>
                    </div>
                    <p id="sendingImprest" style="display: none;">Sending...</p>
                    <button type="submit" id="sasa" class="button-88 my-3 w-100">Submit <i class="las la-arrow-right submit-icon"></i></button>
                </form>
            </div>

        </div>
    </div>
</div>
